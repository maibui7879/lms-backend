name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - chore/contracts-foundation
      - 'feat/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Jest e2e
        run: npm run test:e2e --workspaces --if-present -- --runInBand
      - run: git diff --check
